<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大有錢途｜試用加入</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:520px;margin:0 auto;padding:18px 16px 40px;color:#111827;background:#FFF7ED;font-size:20px;line-height:1.6}
h1{font-size:30px;margin:6px 0 2px;color:#C2410C}
.sub{font-size:18px;color:#374151;margin-bottom:14px}
.warn{background:#FEF3C7;border:2px solid #F59E0B;border-radius:12px;padding:10px 14px;font-weight:800;font-size:20px;margin-bottom:18px}
.step{background:#fff;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.num{display:inline-block;width:40px;height:40px;border-radius:50%;background:#D9480F;color:#fff;font-weight:900;font-size:24px;text-align:center;line-height:40px;margin-right:8px}
.t{font-size:24px;font-weight:900;vertical-align:middle}
.d{font-size:18px;color:#374151;margin:8px 0 12px}
a.btn{display:block;text-align:center;background:#D9480F;color:#fff;text-decoration:none;font-weight:900;font-size:24px;padding:16px;border-radius:14px}
a.btn.g{background:#16A34A}
.foot{font-size:17px;color:#374151;margin-top:20px}
</style>
</head>
<body>
<h1>🚕 大有錢途</h1>
<div class="sub">多元計程車司機免費工具（試用中）</div>
<div class="warn">⚠️ 只有安卓手機能用，iPhone 不行</div>

<div class="step"><span class="num">1</span><span class="t">加入</span>
<div class="d">按下面按鈕，再按「加入群組」。</div>
<a class="btn" href="https://groups.google.com/g/dayouqiantu-testers">① 加入</a></div>

<div class="step"><span class="num">2</span><span class="t">成為測試人員</span>
<div class="d">按下面按鈕，再按「成為測試人員」。</div>
<a class="btn" href="https://play.google.com/apps/testing/tw.hungko.ridelog">② 成為測試人員</a></div>

<div class="step"><span class="num">3</span><span class="t">下載</span>
<div class="d">按下面按鈕，在 Google Play 按「安裝」。</div>
<a class="btn g" href="https://play.google.com/store/apps/details?id=tw.hungko.ridelog">③ 下載</a></div>

<div class="foot">🙏 請試用 14 天，期間不要刪除 App 或退出測試。<br>有問題，按 App 裡的綠色 LINE 按鈕留言。</div>
</body>
</html>
